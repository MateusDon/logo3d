<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>FiltroLogo3D</title>
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="FiltroLogo3D">
    <meta name="mobile-web-app-capable" content="yes">
    
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="icon" type="image/png" sizes="96x96" href="favicon-96x96.png">
    <link class="apple-touch-icon" href="apple-touch-icon.png">
    <link rel="manifest" href="site.webmanifest">
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body, html { width: 100%; height: 100%; overflow: hidden; background: #000; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
        
        /* TELA DE LOGIN PRIVADA */
        #login-screen {
            position: fixed; inset: 0; background: #0f172a; z-index: 10000;
            display: flex; flex-direction: column; align-items: center; justify-content: center; color: white;
        }
        .login-box { background: #1e293b; padding: 40px; border-radius: 24px; text-align: center; box-shadow: 0 20px 25px -5px rgba(0,0,0,0.5); width: 90%; max-width: 400px; }
        .login-logo { width: 100%; max-width: 100%; margin: 0 auto 20px auto; display: block; filter: drop-shadow(0 4px 6px rgba(0,0,0,0.3)); }
        .login-subtitle { opacity: 0.6; font-size: 13px; margin-top: 5px; }
        #login-screen input { padding: 15px; width: 100%; border: none; border-radius: 12px; margin-top: 20px; background: #334155; color: white; text-align: center; font-size: 18px; outline: none; }
        
        /* BOTÃO DE ENTRAR ROXO */
        #login-screen button { 
            padding: 15px 40px; margin-top: 20px; border: none; border-radius: 12px; 
            background: #6d28d9; 
            color: white; font-weight: bold; cursor: pointer; width: 100%; font-size: 16px; 
            transition: background 0.3s;
        }
        #login-screen button:active { background: #5b21b6; }
        #err { color: #f87171; margin-top: 15px; font-size: 14px; display: none; }

        /* LINK DO INSTAGRAM */
        .instagram-link { margin-top: 25px; color: rgba(255,255,255,0.8); text-decoration: none; font-size: 15px; font-weight: 500; display: flex; align-items: center; gap: 8px; }
        .instagram-icon { font-size: 22px; color: #c026d3; }

        /* INTERFACE DO APLICATIVO */
        #app-container { display: none; width: 100%; height: 100%; position: relative; }
        video#preview { width: 100%; height: 100%; object-fit: cover; position: absolute; inset: 0; z-index: 1; }

        /* BARRA SUPERIOR */
        .top-bar { 
            position: absolute; top: 60px; left: 50%; transform: translateX(-50%);
            display: flex; gap: 16px; z-index: 10; padding: 10px 20px;
            background: rgba(0, 0, 0, 0.5); backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px); border-radius: 40px;
            border: 1px solid rgba(255, 255, 255, 0.18);
            transition: opacity 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .btn { 
            background: transparent; border: none; 
            width: 54px; height: 54px; border-radius: 50%; 
            color: white; font-size: 22px; cursor: pointer; 
            display: flex; align-items: center; justify-content: center;
            transition: background 0.2s, transform 0.1s;
        }
        .btn:active { transform: scale(0.85); background: rgba(255, 255, 255, 0.25); }
        .btn-clean { color: #f87171; }
        .btn-back { color: #67e8f9; }

        /* CONTROLES INFERIORES */
        .bottom-bar {
            position: absolute; bottom: 45px; width: 100%;
            display: flex; justify-content: space-between; align-items: center;
            padding: 0 40px; z-index: 10; transition: opacity 0.3s ease;
        }
        .speed-btn {
            width: 52px; height: 52px; background: rgba(0, 0, 0, 0.4); backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 50%; color: white; font-size: 22px;
            display: flex; align-items: center; justify-content: center; cursor: pointer;
        }

        /* CENTRALIZADOR DO BOTÃO E SELETOR */
        .control-center {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 14px;
        }

        /* SELETOR DE MODO DISCRETO */
        .mode-selector {
            display: flex;
            gap: 16px;
            background: rgba(0, 0, 0, 0.45);
            padding: 5px 14px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }
        .mode-item {
            font-size: 11px;
            font-weight: 800;
            color: rgba(255, 255, 255, 0.4);
            cursor: pointer;
            letter-spacing: 1px;
            transition: all 0.2s ease;
        }
        .mode-item.active {
            color: #ffffff;
            text-shadow: 0 0 8px rgba(255, 255, 255, 0.6);
        }

        /* BOTÃO DE CAPTURA DINÂMICO */
        #record-btn {
            width: 76px; height: 76px; background: #ef4444; border: 5px solid white; border-radius: 50%; 
            cursor: pointer; display: flex; align-items: center; justify-content: center; 
            box-shadow: 0 0 20px rgba(239, 68, 68, 0.4); transition: all 0.3s ease; outline: none;
        }
        #record-btn-inner { width: 24px; height: 24px; background: white; border-radius: 50%; transition: all 0.2s; }

        #record-btn.foto-mode {
            background: #ffffff;
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.4);
        }
        #record-btn.foto-mode #record-btn-inner {
            background: #1e293b;
            scale: 0.9;
        }

        /* LOGOMARCA INTERATIVA */
        #logo-wrapper {
            position: absolute; top: 35%; left: 25%; z-index: 5;
            touch-action: none; display: none;
            will-change: transform;
        }
        #logo-container-inner { position: relative; width: 160px; will-change: transform; }
        #logo-img { width: 100%; display: block; }

        /* FLASH DA CÂMERA */
        #flash-overlay {
            position: fixed; inset: 0; background: white; opacity: 0; pointer-events: none; z-index: 99999;
            transition: opacity 0.15s ease-out;
        }
        #flash-overlay.flash-active { opacity: 1; transition: none; }

        .hidden-ui { opacity: 0 !important; pointer-events: none !important; }

        /* TELA DE PRÉ-VISUALIZAÇÃO PREMIUM */
        #preview-modal {
            position: fixed; inset: 0; background: #000; z-index: 20000;
            display: none; flex-direction: column; align-items: center; justify-content: center;
        }
        #preview-modal img, #preview-modal video {
            width: 100%; height: 100%; object-fit: contain; max-height: calc(100% - 140px);
            background: #000;
        }
        /* Dica nativa iOS */
        .ios-tip {
            color: rgba(255, 255, 255, 0.5); font-size: 11px; margin-top: 5px; text-align: center;
            letter-spacing: 0.5px; display: none; pointer-events: none;
        }
        .preview-buttons {
            position: absolute; bottom: 40px; display: flex; flex-direction: column; gap: 8px; width: 100%; padding: 0 32px; align-items: center;
        }
        .btn-row { display: flex; gap: 16px; width: 100%; justify-content: center; max-width: 450px; }
        .preview-btn {
            padding: 16px 28px; border: none; border-radius: 30px; font-weight: bold; font-size: 15px; 
            cursor: pointer; display: flex; align-items: center; gap: 10px; box-shadow: 0 8px 16px rgba(0,0,0,0.4);
            transition: background 0.2s;
        }
        .download-btn { background: #6d28d9; color: white; flex: 1.3; justify-content: center; }
        .download-btn:active { background: #5b21b6; }
        .close-btn { background: rgba(255, 255, 255, 0.15); color: white; backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px); flex: 0.8; justify-content: center; border: 1px solid rgba(255,255,255,0.1); }
        .close-btn:active { background: rgba(255, 255, 255, 0.3); }
    </style>
</head>
<body>

    <div id="flash-overlay"></div>

    <div id="preview-modal">
        <img id="preview-modal-img" style="display:none;" alt="Prévia da Foto">
        <video id="preview-modal-video" style="display:none;" autoplay loop playsinline controls></video>
        <div class="preview-buttons">
            <div class="btn-row">
                <button class="preview-btn close-btn" onclick="fecharPreview()"><i class="fa-solid fa-xmark"></i> VOLTAR</button>
                <button class="preview-btn download-btn" onclick="baixarCaptura()"><i class="fa-solid fa-cloud-arrow-down"></i> SALVAR</button>
            </div>
            <p id="ios-hint" class="ios-tip">💡 Dica: Você também pode segurar o dedo na foto para salvar direto.</p>
        </div>
    </div>

    <div id="login-screen">
        <div class="login-box">
            <img src="logo.png" alt="Logo Premium" class="login-logo">
            <p class="login-subtitle">Acesso Exclusivo por Plataforma</p>
            <input type="text" id="pass" placeholder="Código da sua logomarca">
            <button onclick="login()">ENTRAR NO APP</button>
            <p id="err">Logomarca não encontrada!</p>
        </div>
        
        <a href="https://instagram.com/dogz_criativa" target="_blank" class="instagram-link">
            <i class="fa-brands fa-instagram"></i> @dogz_criativa
        </a>
    </div>

    <div id="app-container" onclick="showControls()">
        <video id="preview" autoplay playsinline muted></video>

        <div class="top-bar" id="ui-top">
            <button class="btn" title="Inverter Câmera" onclick="event.stopPropagation(); switchCam();">
                <i class="fa-solid fa-camera-rotate"></i>
            </button>
            <button class="btn" id="pause-btn" title="Pausar/Girar" onclick="event.stopPropagation(); togglePause();">
                <i class="fa-solid fa-pause" id="pause-icon"></i>
            </button>
            <button class="btn btn-clean" title="Modo Limpo" onclick="event.stopPropagation(); hideControls();">
                <i class="fa-solid fa-eye-slash"></i>
            </button>
            <button class="btn btn-back" title="Voltar ao Início" onclick="event.stopPropagation(); voltarAoInicio();">
                <i class="fa-solid fa-arrow-left"></i>
            </button>
        </div>

        <div id="logo-wrapper">
            <div id="logo-container-inner">
                <img id="logo-img" src="" alt="Logo do Cliente">
            </div>
        </div>

        <div class="bottom-bar" id="ui-bottom">
            <button class="speed-btn" onclick="event.stopPropagation(); changeSpeed(-0.2);"><i class="fa-solid fa-minus"></i></button>
            
            <div class="control-center">
                <div class="mode-selector">
                    <span id="mode-video" class="mode-item active" onclick="event.stopPropagation(); setCaptureMode('video');">VÍDEO</span>
                    <span id="mode-foto" class="mode-item" onclick="event.stopPropagation(); setCaptureMode('foto');">FOTO</span>
                </div>
                
                <button id="record-btn" onclick="event.stopPropagation(); handleCaptureAction();">
                    <div id="record-btn-inner"></div>
                </button>
            </div>
            
            <button class="speed-btn" onclick="event.stopPropagation(); changeSpeed(0.2);"><i class="fa-solid fa-plus"></i></button>
        </div>
    </div>

    <script>
        const TARGET_FPS = 24;
        const FPS_INTERVAL = 1000 / TARGET_FPS; 

        let cachedVideoRect = { left: 0, top: 0, width: 100, height: 100 };
        let cachedLogoRect = { left: 0, top: 0, width: 100, height: 100 };
        let currentMode = 'video';
        
        let urlParaBaixar = "";
        let nomeArquivoParaBaixar = "";

        function updateCachedRects() {
            if (video && logoRender && wrapper.style.display !== 'none') {
                cachedVideoRect = video.getBoundingClientRect();
                const currentTransform = containerInner.style.transform;
                containerInner.style.transform = 'scaleX(1)';
                cachedLogoRect = logoRender.getBoundingClientRect();
                containerInner.style.transform = currentTransform;
            }
        }

        function setCaptureMode(mode) {
            if (isRecording) return;
            currentMode = mode;
            
            document.getElementById('mode-video').classList.toggle('active', mode === 'video');
            document.getElementById('mode-foto').classList.toggle('active', mode === 'foto');
            
            const mainBtn = document.getElementById('record-btn');
            if (mode === 'foto') {
                mainBtn.classList.add('foto-mode');
            } else {
                mainBtn.classList.remove('foto-mode');
            }
        }

        function handleCaptureAction() {
            if (currentMode === 'video') {
                toggleRecording();
            } else {
                takePhoto();
            }
        }

        // --- SISTEMA DE DOWNLOAD E VISUALIZAÇÃO ---
        function abrirPreview(url, nome, tipo) {
            urlParaBaixar = url;
            nomeArquivoParaBaixar = nome;

            const imgModal = document.getElementById('preview-modal-img');
            const videoModal = document.getElementById('preview-modal-video');
            const iosHint = document.getElementById('ios-hint');

            if (tipo === 'foto') {
                imgModal.src = url;
                imgModal.style.display = 'block';
                videoModal.style.display = 'none';
                iosHint.style.display = 'block'; 
            } else {
                videoModal.src = url;
                videoModal.style.display = 'block';
                imgModal.style.display = 'none';
                iosHint.style.display = 'none';
                videoModal.play();
            }

            document.getElementById('preview-modal').style.display = 'flex';
        }

        function baixarCaptura() {
            if (!urlParaBaixar) return;
            const downloadLink = document.createElement('a');
            downloadLink.href = urlParaBaixar;
            downloadLink.download = nomeArquivoParaBaixar;
            document.body.appendChild(downloadLink);
            downloadLink.click();
            document.body.removeChild(downloadLink);
        }

        function fecharPreview() {
            document.getElementById('preview-modal').style.display = 'none';
            
            const videoModal = document.getElementById('preview-modal-video');
            videoModal.pause();
            videoModal.removeAttribute('src');
            videoModal.load();
            document.getElementById('preview-modal-img').removeAttribute('src');
            
            urlParaBaixar = "";
            nomeArquivoParaBaixar = "";

            if (stream && stream.active) {
                const tracksVivas = stream.getTracks().every(track => track.readyState === 'live');
                if (tracksVivas) {
                    video.play().catch(() => {
                        initCamera(); 
                    });
                    return;
                }
            }
            initCamera();
        }

        async function verificarExistenciaNoServidor(nomeLogo) {
            try {
                const resposta = await fetch(`logos/${nomeLogo}.png?t=${Date.now()}`, {
                    method: 'GET',
                    cache: 'no-store',
                    headers: { 'Cache-Control': 'no-cache', 'Pragma': 'no-cache' }
                });
                if (!resposta.ok) return false;
                const contentType = resposta.headers.get('content-type');
                if (contentType && !contentType.includes('image')) return false; 
                return true; 
            } catch (erro) {
                return false; 
            }
        }

        async function verificarLoginSalvo() {
            const senhaSalva = localStorage.getItem('app_senha');
            const dataLogin = localStorage.getItem('app_data_login');

            if (senhaSalva && dataLogin) {
                const umMesEmMilissegundos = 30 * 24 * 60 * 60 * 1000;
                const expirou = (Date.now() - parseInt(dataLogin)) > umMesEmMilissegundos;

                if (!expirou) {
                    const existeNoServidor = await verificarExistenciaNoServidor(senhaSalva);
                    if (existeNoServidor) {
                        const logoUrl = `logos/${senhaSalva}.png?t=${Date.now()}`;
                        setupLogoFromUrl(logoUrl);
                        liberarAcesso();
                    } else {
                        voltarAoInicio();
                    }
                    return;
                }
                voltarAoInicio();
            }
        }

        async function login() {
            const logoName = document.getElementById('pass').value.trim().toLowerCase();
            if(!logoName) return;

            document.getElementById('err').style.display = 'none';
            const existeNoServidor = await verificarExistenciaNoServidor(logoName);
            
            if (existeNoServidor) {
                localStorage.setItem('app_senha', logoName);
                localStorage.setItem('app_data_login', Date.now());
                const logoUrl = `logos/${logoName}.png?t=${Date.now()}`;
                setupLogoFromUrl(logoUrl);
                liberarAcesso();
            } else {
                document.getElementById('err').innerText = "Código de logomarca inválido ou expirado!";
                document.getElementById('err').style.display = 'block';
                limparCredenciais();
            }
        }

        function setupLogoFromUrl(url) {
            logoRender.src = url;
            wrapper.style.display = 'block';
            setTimeout(updateCachedRects, 300);
        }

        function liberarAcesso() {
            document.getElementById('login-screen').style.display='none';
            document.getElementById('app-container').style.display='block';
            initCamera();
            setCaptureMode('video');
            setTimeout(updateCachedRects, 1000);
        }

        function voltarAoInicio() {
            if (isRecording) stopRecording();
            limparCredenciais();

            if (stream) {
                stream.getTracks().forEach(t => t.stop());
                stream = null;
            }
            if (recordingStream) {
                recordingStream.getTracks().forEach(track => track.stop());
                recordingStream = null;
            }

            logoRender.removeAttribute('src');
            wrapper.style.display = 'none';
            
            document.getElementById('app-container').style.display='none';
            document.getElementById('login-screen').style.display='flex';
            document.getElementById('pass').value = "";
            document.getElementById('err').style.display = 'none';
        }

        function limparCredenciais() {
            localStorage.removeItem('app_senha');
            localStorage.removeItem('app_data_login');
        }

        window.addEventListener('DOMContentLoaded', verificarLoginSalvo);
        
        let resizeTimeout;
        window.addEventListener('resize', () => {
            clearTimeout(resizeTimeout);
            resizeTimeout = setTimeout(updateCachedRects, 150);
        });

        // --- CONTROLE DA CÂMERA ---
        let stream;
        let camMode = "environment"; 
        const video = document.getElementById('preview');

        async function initCamera() {
            if(stream) stream.getTracks().forEach(t => t.stop());
            try {
                stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: camMode, width: { ideal: 1280 }, height: { ideal: 720 } }, 
                    audio: { channelCount: 1, echoCancellation: true, noiseSuppression: true, autoGainControl: true }
                });
                video.srcObject = stream;
            } catch (err) {
                console.warn("Iniciando sem microfone...", err);
                try {
                    stream = await navigator.mediaDevices.getUserMedia({ 
                        video: { facingMode: camMode, width: { ideal: 1280 }, height: { ideal: 720 } }, 
                        audio: false
                    });
                    video.srcObject = stream;
                } catch(finalErr) {
                    alert("A permissão da câmera é necessária.");
                }
            }
        }

        function switchCam() { 
            camMode = camMode === "user" ? "environment" : "user"; 
            initCamera(); 
            setTimeout(updateCachedRects, 1000);
        }

        // --- MOTOR DE ANIMAÇÃO ---
        const wrapper = document.getElementById('logo-wrapper');
        const containerInner = document.getElementById('logo-container-inner');
        const logoRender = document.getElementById('logo-img');
        
        let counter = 0;
        let speed = 0.04; 
        let isPaused = false;
        let lastAnimTime = 0;

        let mediaRecorder;
        let recordedChunks = [];
        let isRecording = false;
        let recordingCanvas = document.createElement('canvas');
        let recordCtx = recordingCanvas.getContext('2d');
        let recordingStream;

        function animateLoop(timestamp) {
            requestAnimationFrame(animateLoop);
            if (!timestamp) timestamp = performance.now();
            const elapsed = timestamp - lastAnimTime;
            if (elapsed < FPS_INTERVAL) return;
            lastAnimTime = timestamp - (elapsed % FPS_INTERVAL);

            if (!isPaused) {
                counter += (speed * (TARGET_FPS / 30)); 
                let scaleX = Math.abs(Math.sin(counter));
                containerInner.style.transform = `scaleX(${scaleX})`;
            }

            if (isRecording) {
                recordCtx.drawImage(video, 0, 0, recordingCanvas.width, recordingCanvas.height);
                if (wrapper.style.display !== 'none' && logoRender.getAttribute('src')) {
                    recordCtx.save();
                    const videoRect = cachedVideoRect;
                    const logoRect = cachedLogoRect;

                    // Calcula o aspecto real da câmera comparado à tela física (Simula o object-fit: cover)
                    const streamWidth = video.videoWidth || 720;
                    const streamHeight = video.videoHeight || 1280;
                    const streamRatio = streamWidth / streamHeight;
                    const elementRatio = videoRect.width / videoRect.height;

                    let renderWidth, renderHeight, renderLeft, renderTop;
                    if (elementRatio < streamRatio) {
                        renderHeight = videoRect.height;
                        renderWidth = videoRect.height * streamRatio;
                        renderLeft = videoRect.left + (videoRect.width - renderWidth) / 2;
                        renderTop = videoRect.top;
                    } else {
                        renderWidth = videoRect.width;
                        renderHeight = videoRect.width / streamRatio;
                        renderLeft = videoRect.left;
                        renderTop = videoRect.top + (videoRect.height - renderHeight) / 2;
                    }

                    const logoCenterX = logoRect.left + logoRect.width / 2;
                    const logoCenterY = logoRect.top + logoRect.height / 2;

                    // Faz o mapeamento milimétrico e proporcional sem achatar
                    const normX = (logoCenterX - renderLeft) / renderWidth;
                    const normY = (logoCenterY - renderTop) / renderHeight;
                    const normW = logoRect.width / renderWidth;
                    const normH = logoRect.height / renderHeight;

                    const canvasLogoX = normX * recordingCanvas.width;
                    const canvasLogoY = normY * recordingCanvas.height;
                    const canvasLogoW = normW * recordingCanvas.width;
                    const canvasLogoH = normH * recordingCanvas.height;

                    recordCtx.translate(canvasLogoX, canvasLogoY);
                    let scaleX = Math.abs(Math.sin(counter));
                    recordCtx.scale(scaleX, 1);
                    recordCtx.drawImage(logoRender, -canvasLogoW / 2, -canvasLogoH / 2, canvasLogoW, canvasLogoH);
                    recordCtx.restore();
                }
            }
        }
        animateLoop();
        
        function togglePause() { 
            isPaused = !isPaused;
            const icon = document.getElementById('pause-icon');
            icon.className = isPaused ? "fa-solid fa-play" : "fa-solid fa-pause";
        }

        function changeSpeed(amount) {
            speed += (amount * 0.05);
            speed = Math.max(0.01, Math.min(speed, 0.15)); 
        }

        // --- GESTOS TOUCH NO LOGO ---
        let posX=0, posY=0, lastX=0, lastY=0, scale=1, lastScale=1, startDist=0;

        wrapper.addEventListener('touchstart', e => {
            if(e.touches.length===1) { 
                lastX=e.touches[0].clientX-posX; 
                lastY=e.touches[0].clientY-posY; 
            }
            if(e.touches.length===2) { 
                startDist = Math.hypot(e.touches[0].clientX-e.touches[1].clientX, e.touches[0].clientY-e.touches[1].clientY); 
                lastScale = scale; 
            }
        });

        wrapper.addEventListener('touchmove', e => {
            if(e.touches.length===1) { 
                posX=e.touches[0].clientX-lastX; 
                posY=e.touches[0].clientY-lastY; 
            }
            if(e.touches.length===2) {
                let d = Math.hypot(e.touches[0].clientX-e.touches[1].clientX, e.touches[0].clientY-e.touches[1].clientY);
                scale = Math.max(0.3, Math.min(lastScale * (d/startDist), 3)); 
            }
            wrapper.style.transform = `translate(${posX}px, ${posY}px) scale(${scale})`;
            updateCachedRects();
        });

        const uiTop = document.getElementById('ui-top');
        const uiBottom = document.getElementById('ui-bottom');
        function hideControls() { uiTop.classList.add('hidden-ui'); uiBottom.classList.add('hidden-ui'); }
        function showControls() { uiTop.classList.remove('hidden-ui'); uiBottom.classList.remove('hidden-ui'); }

        // --- ENGINE DE CAPTURA DE FOTO ---
        function takePhoto() {
            if (isRecording) return;
            updateCachedRects();

            const flash = document.getElementById('flash-overlay');
            flash.classList.add('flash-active');
            setTimeout(() => flash.classList.remove('flash-active'), 60);

            const photoCanvas = document.createElement('canvas');
            const pCtx = photoCanvas.getContext('2d');
            
            // Força a proporção exata nativa da câmera
            photoCanvas.width = video.videoWidth || 1080;
            photoCanvas.height = video.videoHeight || 1920;

            pCtx.imageSmoothingEnabled = true;
            pCtx.imageSmoothingQuality = 'high';
            pCtx.drawImage(video, 0, 0, photoCanvas.width, photoCanvas.height);

            if (wrapper.style.display !== 'none' && logoRender.getAttribute('src')) {
                pCtx.save();
                const videoRect = cachedVideoRect;
                const logoRect = cachedLogoRect;

                const streamWidth = video.videoWidth || 720;
                const streamHeight = video.videoHeight || 1280;
                const streamRatio = streamWidth / streamHeight;
                const elementRatio = videoRect.width / videoRect.height;

                let renderWidth, renderHeight, renderLeft, renderTop;
                if (elementRatio < streamRatio) {
                    renderHeight = videoRect.height;
                    renderWidth = videoRect.height * streamRatio;
                    renderLeft = videoRect.left + (videoRect.width - renderWidth) / 2;
                    renderTop = videoRect.top;
                } else {
                    renderWidth = videoRect.width;
                    renderHeight = videoRect.width / streamRatio;
                    renderLeft = videoRect.left;
                    renderTop = videoRect.top + (videoRect.height - renderHeight) / 2;
                }

                const logoCenterX = logoRect.left + logoRect.width / 2;
                const logoCenterY = logoRect.top + logoRect.height / 2;

                const normX = (logoCenterX - renderLeft) / renderWidth;
                const normY = (logoCenterY - renderTop) / renderHeight;
                const normW = logoRect.width / renderWidth;
                const normH = logoRect.height / renderHeight;

                const canvasLogoX = normX * photoCanvas.width;
                const canvasLogoY = normY * photoCanvas.height;
                const canvasLogoW = normW * photoCanvas.width;
                const canvasLogoH = normH * photoCanvas.height;

                pCtx.translate(canvasLogoX, canvasLogoY);
                let scaleX = Math.abs(Math.sin(counter));
                pCtx.scale(scaleX, 1);
                pCtx.drawImage(logoRender, -canvasLogoW / 2, -canvasLogoH / 2, canvasLogoW, canvasLogoH);
                pCtx.restore();
            }

            try {
                const fileUrl = photoCanvas.toDataURL('image/jpeg', 0.95);
                const nomeFoto = `logocam_foto_${Date.now()}.jpg`;
                abrirPreview(fileUrl, nomeFoto, 'foto');
            } catch (err) {
                console.error(err);
            }
        }

        // --- DISPARADOR DE GRAVAÇÃO (VÍDEO) ---
        function toggleRecording() {
            if (!isRecording) {
                startRecording();
            } else {
                stopRecording();
            }
        }

        async function startRecording() {
            if (isRecording) return;
            updateCachedRects();

            const btnInner = document.getElementById('record-btn-inner');
            btnInner.style.borderRadius = '4px';
            btnInner.style.scale = '0.8';
            document.getElementById('record-btn').style.background = '#dc2626';

            recordedChunks = [];
            const ua = navigator.userAgent;
            const isAndroid = /Android/i.test(ua);
            let videoBitrate = 2500000; // Bitrate elevado para garantir qualidade premium

            // Define o tamanho da gravação com base no tamanho real enviado pelo sensor da câmera
            recordingCanvas.width = video.videoWidth || 720;
            recordingCanvas.height = video.videoHeight || 1280;
            recordCtx.imageSmoothingEnabled = true;

            isRecording = true;
            recordingStream = recordingCanvas.captureStream(TARGET_FPS); 

            let combinedStream;
            if (stream && stream.getAudioTracks().length > 0) {
                combinedStream = new MediaStream([
                    recordingStream.getVideoTracks()[0],
                    stream.getAudioTracks()[0]
                ]);
            } else {
                combinedStream = recordingStream;
            }

            let options = {};
            if (isAndroid) {
                options = { mimeType: 'video/webm;codecs=h264', videoBitsPerSecond: videoBitrate };
            } else {
                if (MediaRecorder.isTypeSupported('video/mp4;codecs=avc1')) {
                    options = { mimeType: 'video/mp4;codecs=avc1', videoBitsPerSecond: videoBitrate, audioBitsPerSecond: 64000 };
                } else {
                    options = { mimeType: 'video/mp4', videoBitsPerSecond: videoBitrate, audioBitsPerSecond: 64000 };
                }
            }

            try {
                mediaRecorder = new MediaRecorder(combinedStream, options);
            } catch (err) {
                try {
                    mediaRecorder = new MediaRecorder(combinedStream);
                } catch(finalErr) {
                    resetRecordButton();
                    isRecording = false;
                    alert("Erro: Navegador incompatível com gravação.");
                    return;
                }
            }

            mediaRecorder.ondataavailable = (e) => {
                if (e.data && e.data.size > 0) recordedChunks.push(e.data);
            };

            mediaRecorder.onstop = () => {
                if (recordedChunks.length === 0) return;
                const blob = new Blob(recordedChunks, { type: mediaRecorder.mimeType || 'video/webm' });
                const fileUrl = URL.createObjectURL(blob);
                const ext = (mediaRecorder.mimeType && mediaRecorder.mimeType.includes('mp4')) ? 'mp4' : 'webm';
                const nomeVideo = `logocam_pro_${Date.now()}.${ext}`;

                if (recordingStream) {
                    recordingStream.getTracks().forEach(track => track.stop());
                }
                abrirPreview(fileUrl, nomeVideo, 'video');
            };

            mediaRecorder.start();
        }

        function stopRecording() {
            if (!isRecording) return;
            isRecording = false;
            resetRecordButton();
            if (mediaRecorder && mediaRecorder.state !== 'inactive') mediaRecorder.stop();
        }

        function resetRecordButton() {
            const btnInner = document.getElementById('record-btn-inner');
            btnInner.style.borderRadius = '50%';
            btnInner.style.scale = '1';
            document.getElementById('record-btn').style.background = '#ef4444';
        }
    </script>
