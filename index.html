<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>LogoCam Pro</title>
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="mobile-web-app-capable" content="yes">
    
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="icon" type="image/png" sizes="96x96" href="favicon-96x96.png">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <link rel="manifest" href="site.webmanifest">
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <script src="senhas.js"></script>
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body, html { width: 100%; height: 100%; overflow: hidden; background: #000; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
        
        /* TELA DE LOGIN PRIVADA */
        #login-screen {
            position: fixed; inset: 0; background: #0f172a; z-index: 10000;
            display: flex; flex-direction: column; align-items: center; justify-content: center; color: white;
        }
        .login-box { background: #1e293b; padding: 40px; border-radius: 24px; text-align: center; box-shadow: 0 20px 25px -5px rgba(0,0,0,0.5); width: 90%; max-width: 400px; }
        #login-screen input { padding: 15px; width: 100%; border: none; border-radius: 12px; margin-top: 20px; background: #334155; color: white; text-align: center; font-size: 18px; outline: none; }
        
        /* BOTÃO DE ENTRAR ROXO */
        #login-screen button { 
            padding: 15px 40px; margin-top: 20px; border: none; border-radius: 12px; 
            background: #6d28d9; 
            color: white; font-weight: bold; cursor: pointer; width: 100%; font-size: 16px; 
            transition: background 0.3s;
        }
        #login-screen button:active { background: #5b21b6; }

        /* INTERFACE DO APLICATIVO */
        #app-container { display: none; width: 100%; height: 100%; position: relative; }
        video#preview { width: 100%; height: 100%; object-fit: cover; position: absolute; inset: 0; z-index: 1; }

        /* BARRA SUPERIOR MODERNA COM ÍCONES AMPLIADOS */
        .top-bar { 
            position: absolute; top: 60px; left: 50%; transform: translateX(-50%);
            display: flex; gap: 16px; z-index: 10; padding: 10px 20px;
            background: rgba(0, 0, 0, 0.5); backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px); border-radius: 40px;
            border: 1px solid rgba(255, 255, 255, 0.18);
            transition: opacity 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .btn { 
            background: transparent; border: none; 
            width: 54px; height: 54px; border-radius: 50%; 
            color: white; font-size: 22px; cursor: pointer; 
            display: flex; align-items: center; justify-content: center;
            transition: background 0.2s, transform 0.1s;
        }
        .btn:active { transform: scale(0.85); background: rgba(255, 255, 255, 0.25); }
        .btn-clean { color: #f87171; }

        /* CONTROLES DE VELOCIDADE E GRAVAÇÃO INFERIORES */
        .bottom-bar {
            position: absolute; bottom: 50px; width: 100%;
            display: flex; justify-content: space-between; align-items: center;
            padding: 0 40px; z-index: 10; transition: opacity 0.3s ease;
        }
        .speed-btn {
            width: 52px; height: 52px; background: rgba(0, 0, 0, 0.4); backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 50%; color: white; font-size: 22px;
            display: flex; align-items: center; justify-content: center; cursor: pointer;
        }

        /* BOTÃO DE GRAVAR PROFISSIONAL VIA POINTER EVENTS */
        #record-btn {
            width: 76px; height: 76px; background: #ef4444; border: 5px solid white; border-radius: 50%; 
            cursor: pointer; display: flex; align-items: center; justify-content: center; 
            box-shadow: 0 0 20px rgba(239, 68, 68, 0.6); transition: transform 0.2s; outline: none;
        }

        /* LOGOMARCA INTERATIVA E MÁSCARA DO REFLEXO */
        #logo-wrapper {
            position: absolute; top: 35%; left: 25%; z-index: 5;
            touch-action: none; display: none;
        }
        
        #logo-container-inner {
            position: relative;
            width: 160px;
            will-change: transform;
        }
        
        #logo-img {
            width: 100%;
            display: block;
        }

        /* CAMADA DO REFLEXO LUMINOSO DENTRO DA LOGO */
        #logo-shine {
            position: absolute;
            inset: 0;
            mix-blend-mode: source-atop; 
            background: linear-gradient(
                90deg, 
                rgba(255, 255, 255, 0) 0%, 
                rgba(255, 255, 255, 0.03) 25%, 
                rgba(255, 255, 255, 0.45) 50%, 
                rgba(255, 255, 255, 0.03) 75%, 
                rgba(255, 255, 255, 0) 100%
            );
            background-size: 200% 100%;
            background-position: 150% 0;
            pointer-events: none;
        }

        .hidden-ui { opacity: 0 !important; pointer-events: none !important; }
    </style>
</head>
<body>

    <div id="login-screen">
        <div class="login-box">
            <img src="logo.png" alt="Logo Premium" style="width: 100%; max-width: 100%; margin: 0 auto 20px auto; display: block; filter: drop-shadow(0 4px 6px rgba(0,0,0,0.3));">
            <p style="opacity:0.6; font-size: 13px; margin-top: 5px;">Acesso Exclusivo</p>
            <input type="password" id="pass" placeholder="Digite sua senha de acesso">
            <button onclick="login()">ENTRAR NO APP</button>
            <p id="err" style="color: #f87171; margin-top: 15px; font-size: 14px; display: none;">Senha incorreta!</p>
        </div>
        
        <a href="https://instagram.com/dogz_criativa" target="_blank" style="margin-top: 25px; color: rgba(255,255,255,0.8); text-decoration: none; font-size: 15px; font-weight: 500; display: flex; align-items: center; gap: 8px;">
            <i class="fa-brands fa-instagram" style="font-size: 22px; color: #c026d3;"></i> @dogz_criativa
        </a>
    </div>

    <div id="app-container" onclick="showControls()">
        <video id="preview" autoplay playsinline muted></video>

        <div class="top-bar" id="ui-top">
            <button class="btn" title="Inverter Câmera" onclick="event.stopPropagation(); switchCam();">
                <i class="fa-solid fa-camera-rotate"></i>
            </button>
            <button class="btn" title="Escolher Logo" onclick="event.stopPropagation(); document.getElementById('upload').click();">
                <i class="fa-solid fa-image"></i>
            </button>
            <button class="btn" id="pause-btn" title="Pausar/Girar" onclick="event.stopPropagation(); togglePause();">
                <i class="fa-solid fa-pause" id="pause-icon"></i>
            </button>
            <button class="btn btn-clean" title="Modo Limpo" onclick="event.stopPropagation(); hideControls();">
                <i class="fa-solid fa-eye-slash"></i>
            </button>
            <input type="file" id="upload" accept="image/png" style="display:none" onchange="loadLogo(event)">
        </div>

        <div id="logo-wrapper">
            <div id="logo-container-inner">
                <img id="logo-img" src="" alt="Logo do Cliente">
                <div id="logo-shine"></div>
            </div>
        </div>

        <div class="bottom-bar" id="ui-bottom">
            <button class="speed-btn" onclick="event.stopPropagation(); changeSpeed(-0.2);"><i class="fa-solid fa-minus"></i></button>
            
            <button id="record-btn" 
                    onclick="event.stopPropagation();"
                    onpointerdown="event.stopPropagation(); startRecording();"
                    onpointerup="event.stopPropagation(); stopRecording();"
                    onpointerleave="event.stopPropagation(); stopRecording();">
                <div id="record-btn-inner" style="width: 24px; height: 24px; background: white; border-radius: 50%; transition: all 0.2s;"></div>
            </button>
            
            <button class="speed-btn" onclick="event.stopPropagation(); changeSpeed(0.2);"><i class="fa-solid fa-plus"></i></button>
        </div>
    </div>

    <script>
        // --- GERENCIAMENTO DE SENHAS E AUTO-LOGIN (1 MÊS) ---
        function verificarLoginSalvo() {
            const senhaSalva = localStorage.getItem('app_senha');
            const dataLogin = localStorage.getItem('app_data_login');

            if (senhaSalva && dataLogin) {
                const umMesEmMilissegundos = 30 * 24 * 60 * 60 * 1000;
                const expirou = (Date.now() - parseInt(dataLogin)) > umMesEmMilissegundos;
                const senhaAindaEValida = typeof vips !== 'undefined' && vips.includes(senhaSalva);

                if (!expirou && senhaAindaEValida) {
                    liberarAcesso();
                } else {
                    localStorage.removeItem('app_senha');
                    localStorage.removeItem('app_data_login');
                }
            }
        }

        function login() {
            const passwordInput = document.getElementById('pass').value;
            
            if(typeof vips !== 'undefined' && vips.includes(passwordInput)) {
                localStorage.setItem('app_senha', passwordInput);
                localStorage.setItem('app_data_login', Date.now());
                liberarAcesso();
            } else { 
                document.getElementById('err').style.display='block'; 
            }
        }

        function liberarAcesso() {
            document.getElementById('login-screen').style.display='none';
            document.getElementById('app-container').style.display='block';
            initCamera();
        }

        window.addEventListener('DOMContentLoaded', verificarLoginSalvo);


        // --- CONTROLE DA CÂMERA E AUDIO ---
        let stream;
        let camMode = "environment"; 
        const video = document.getElementById('preview');

        async function initCamera() {
            if(stream) stream.getTracks().forEach(t => t.stop());
            try {
                stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: camMode, width: { ideal: 1920 }, height: { ideal: 1080 } }, 
                    audio: true
                });
                video.srcObject = stream;
            } catch (err) {
                console.warn("Microfone indisponível, iniciando sem áudio...", err);
                try {
                    stream = await navigator.mediaDevices.getUserMedia({ 
                        video: { facingMode: camMode, width: { ideal: 1920 }, height: { ideal: 1080 } }, 
                        audio: false
                    });
                    video.srcObject = stream;
                } catch(finalErr) {
                    alert("A permissão da câmera é necessária.");
                }
            }
        }

        function switchCam() { 
            camMode = camMode === "user" ? "environment" : "user"; 
            initCamera(); 
        }

        // --- ANIMAÇÃO DE GIRO E REFLEXO ---
        const wrapper = document.getElementById('logo-wrapper');
        const containerInner = document.getElementById('logo-container-inner');
        const logoRender = document.getElementById('logo-img');
        const shine = document.getElementById('logo-shine');
        
        let counter = 0;
        let speed = 0.04; 
        let isPaused = false;

        function animateLogo() {
            if (!isPaused) {
                counter += speed;
                let scaleX = Math.abs(Math.sin(counter));
                containerInner.style.transform = `scaleX(${scaleX})`;
                let shinePos = (Math.sin(counter) * 150) + 50;
                shine.style.backgroundPosition = `${shinePos}% 0`;
            }
            requestAnimationFrame(animateLogo);
        }
        animateLogo();

        function loadLogo(e) {
            const file = e.target.files[0];
            const objectUrl = URL.createObjectURL(file);
            
            logoRender.src = objectUrl;
            
            shine.style.webkitMaskImage = `url(${objectUrl})`;
            shine.style.webkitMaskSize = 'contain';
            shine.style.webkitMaskRepeat = 'no-repeat';
            shine.style.webkitMaskPosition = 'center';
            
            shine.style.maskImage = `url(${objectUrl})`;
            shine.style.maskSize = 'contain';
            shine.style.maskRepeat = 'no-repeat';
            shine.style.maskPosition = 'center';
            
            wrapper.style.display = 'block';
        }
        
        function togglePause() { 
            isPaused = !isPaused;
            const icon = document.getElementById('pause-icon');
            icon.className = isPaused ? "fa-solid fa-play" : "fa-solid fa-pause";
        }

        function changeSpeed(amount) {
            speed += (amount * 0.05);
            speed = Math.max(0.01, Math.min(speed, 0.15)); 
        }

        // --- GESTOS TOUCH ---
        let posX=0, posY=0, lastX=0, lastY=0, scale=1, lastScale=1, startDist=0;

        wrapper.addEventListener('touchstart', e => {
            if(e.touches.length===1) { 
                lastX=e.touches[0].clientX-posX; 
                lastY=e.touches[0].clientY-posY; 
            }
            if(e.touches.length===2) { 
                startDist = Math.hypot(e.touches[0].clientX-e.touches[1].clientX, e.touches[0].clientY-e.touches[1].clientY); 
                lastScale = scale; 
            }
        });

        wrapper.addEventListener('touchmove', e => {
            if(e.touches.length===1) { 
                posX=e.touches[0].clientX-lastX; 
                posY=e.touches[0].clientY-lastY; 
            }
            if(e.touches.length===2) {
                let d = Math.hypot(e.touches[0].clientX-e.touches[1].clientX, e.touches[0].clientY-e.touches[1].clientY);
                scale = Math.max(0.3, Math.min(lastScale * (d/startDist), 3)); 
            }
            wrapper.style.transform = `translate(${posX}px, ${posY}px) scale(${scale})`;
        });

        const uiTop = document.getElementById('ui-top');
        const uiBottom = document.getElementById('ui-bottom');

        function hideControls() { uiTop.classList.add('hidden-ui'); uiBottom.classList.add('hidden-ui'); }
        function showControls() { uiTop.classList.remove('hidden-ui'); uiBottom.classList.remove('hidden-ui'); }


        // --- 🔥 MOTOR DE GRAVAÇÃO INVISÍVEL COM RESOLUÇÃO ADAPTATIVA PROFISSIONAL ---
        let mediaRecorder;
        let recordedChunks = [];
        let isRecording = false;
        let recordingCanvas = document.createElement('canvas');
        let recordCtx = recordingCanvas.getContext('2d');
        let recordingStream;
        let recordingStartTime = 0;

        function drawRecordingFrame() {
            if (!isRecording) return;

            // Desenha o vídeo de fundo no Canvas (redimensiona automaticamente para a resolução escolhida)
            recordCtx.drawImage(video, 0, 0, recordingCanvas.width, recordingCanvas.height);

            if (wrapper.style.display !== 'none' && logoRender.src) {
                recordCtx.save();

                const videoRect = video.getBoundingClientRect();
                const logoRect = logoRender.getBoundingClientRect();

                // Fatores de escala dinâmicos baseados na resolução atual do Canvas
                const scaleXFactor = recordingCanvas.width / videoRect.width;
                const scaleYFactor = recordingCanvas.height / videoRect.height;

                const logoCenterX = logoRect.left + logoRect.width / 2;
                const logoCenterY = logoRect.top + logoRect.height / 2;

                const canvasLogoX = (logoCenterX - videoRect.left) * scaleXFactor;
                const canvasLogoY = (logoCenterY - videoRect.top) * scaleYFactor;

                const canvasLogoW = logoRect.width * scaleXFactor;
                const canvasLogoH = logoRect.height * scaleYFactor;

                recordCtx.translate(canvasLogoX, canvasLogoY);
                recordCtx.drawImage(logoRender, -canvasLogoW / 2, -canvasLogoH / 2, canvasLogoW, canvasLogoH);
                
                recordCtx.restore();
            }

            requestAnimationFrame(drawRecordingFrame);
        }

        async function startRecording() {
            if (isRecording) return;

            recordingStartTime = Date.now();

            document.getElementById('record-btn-inner').style.borderRadius = '4px';
            document.getElementById('record-btn-inner').style.scale = '0.8';
            document.getElementById('record-btn').style.transform = 'scale(1.1)';

            recordedChunks = [];
            
            // 🔥 OTIMIZAÇÃO HISTÓRICA: Se for Android, usa 720p estável. Se for iPhone, usa resolução máxima.
            const isAndroid = /Android/i.test(navigator.userAgent);
            if (isAndroid) {
                recordingCanvas.width = 720;
                recordingCanvas.height = 1280;
            } else {
                recordingCanvas.width = video.videoWidth || 1080;
                recordingCanvas.height = video.videoHeight || 1920;
            }

            isRecording = true;
            drawRecordingFrame();

            // Captura o fluxo visual limpo do Canvas
            recordingStream = recordingCanvas.captureStream(30);

            // Injeta a faixa de áudio ativa do microfone direto no fluxo de gravação
            if (stream && stream.getAudioTracks().length > 0) {
                const micTrack = stream.getAudioTracks()[0];
                recordingStream.addTrack(micTrack);
            }

            // Seleção inteligente do codec suportado por cada aparelho
            let options = { mimeType: 'video/webm;codecs=vp9' };
            if (!MediaRecorder.isTypeSupported(options)) options = { mimeType: 'video/webm;codecs=vp8' };
            if (!MediaRecorder.isTypeSupported(options)) options = { mimeType: 'video/webm' };
            if (!MediaRecorder.isTypeSupported(options)) options = { mimeType: 'video/mp4' };
            if (!MediaRecorder.isTypeSupported(options)) options = {};

            try {
                mediaRecorder = new MediaRecorder(recordingStream, options);

                mediaRecorder.ondataavailable = (e) => {
                    if (e.data && e.data.size > 0) {
                        recordedChunks.push(e.data);
                    }
                };

                mediaRecorder.onstop = () => {
                    if (recordedChunks.length === 0) return;

                    const blob = new Blob(recordedChunks, { type: mediaRecorder.mimeType || 'video/webm' });
                    const fileUrl = URL.createObjectURL(blob);

                    const downloadLink = document.createElement('a');
                    downloadLink.href = fileUrl;

                    const ext = (mediaRecorder.mimeType && mediaRecorder.mimeType.includes('mp4')) ? 'mp4' : 'webm';
                    downloadLink.download = `logocam_pro_${Date.now()}.${ext}`;
                    document.body.appendChild(downloadLink);

                    downloadLink.click();

                    setTimeout(() => {
                        if (downloadLink.parentNode) {
                            document.body.removeChild(downloadLink);
                        }
                        URL.revokeObjectURL(fileUrl);
                    }, 5000);
                };

                mediaRecorder.start(100);
            } catch (err) {
                console.error("Erro ao iniciar gravação:", err);
                resetRecordButton();
                isRecording = false;
            }
        }

        function stopRecording() {
            if (!isRecording) return;
            isRecording = false;

            resetRecordButton();

            const duration = Date.now() - recordingStartTime;

            if (mediaRecorder && mediaRecorder.state !== 'inactive') {
                if (duration < 1000) {
                    mediaRecorder.ondataavailable = null;
                    mediaRecorder.onstop = null;
                    try { mediaRecorder.stop(); } catch(e) {}
                    if (recordingStream) {
                        recordingStream.getTracks().forEach(track => track.stop());
                    }
                    alert("⚠️ Segure o botão para gravar! Um clique rápido não gera vídeo.");
                    return;
                }
                mediaRecorder.stop();
            }

            if (recordingStream) {
                recordingStream.getTracks().forEach(track => track.stop());
            }
        }

        function resetRecordButton() {
            document.getElementById('record-btn-inner').style.borderRadius = '50%';
            document.getElementById('record-btn-inner').style.scale = '1';
            document.getElementById('record-btn').style.transform = 'scale(1)';
        }
    </script>
</body>
</html>
