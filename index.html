<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>FiltroLogo3D</title>
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="FiltroLogo3D">
    <meta name="mobile-web-app-capable" content="yes">
    
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="icon" type="image/png" sizes="96x96" href="favicon-96x96.png">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <link rel="manifest" href="site.webmanifest">
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body, html { width: 100%; height: 100%; overflow: hidden; background: #000; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
        
        /* TELA DE LOGIN PRIVADA */
        #login-screen {
            position: fixed; inset: 0; background: #0f172a; z-index: 10000;
            display: flex; flex-direction: column; align-items: center; justify-content: center; color: white;
        }
        .login-box { background: #1e293b; padding: 40px; border-radius: 24px; text-align: center; box-shadow: 0 20px 25px -5px rgba(0,0,0,0.5); width: 90%; max-width: 400px; }
        #login-screen input { padding: 15px; width: 100%; border: none; border-radius: 12px; margin-top: 20px; background: #334155; color: white; text-align: center; font-size: 18px; outline: none; }
        
        /* BOTÃO DE ENTRAR ROXO */
        #login-screen button { 
            padding: 15px 40px; margin-top: 20px; border: none; border-radius: 12px; 
            background: #6d28d9; 
            color: white; font-weight: bold; cursor: pointer; width: 100%; font-size: 16px; 
            transition: background 0.3s;
        }
        #login-screen button:active { background: #5b21b6; }

        /* INTERFACE DO APLICATIVO */
        #app-container { display: none; width: 100%; height: 100%; position: relative; }
        video#preview { width: 100%; height: 100%; object-fit: cover; position: absolute; inset: 0; z-index: 1; }

        /* BARRA SUPERIOR MODERNA - Blur reduzido para performance */
        .top-bar { 
            position: absolute; top: 60px; left: 50%; transform: translateX(-50%);
            display: flex; gap: 16px; z-index: 10; padding: 10px 20px;
            background: rgba(0, 0, 0, 0.6); backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px); border-radius: 40px;
            border: 1px solid rgba(255, 255, 255, 0.18);
            transition: opacity 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .btn { 
            background: transparent; border: none; 
            width: 54px; height: 54px; border-radius: 50%; 
            color: white; font-size: 22px; cursor: pointer; 
            display: flex; align-items: center; justify-content: center;
            transition: background 0.2s, transform 0.1s;
        }
        .btn:active { transform: scale(0.85); background: rgba(255, 255, 255, 0.25); }
        .btn-clean { color: #f87171; }

        /* CONTROLES DE VELOCIDADE E GRAVAÇÃO INFERIORES */
        .bottom-bar {
            position: absolute; bottom: 50px; width: 100%;
            display: flex; justify-content: space-between; align-items: center;
            padding: 0 40px; z-index: 10; transition: opacity 0.3s ease;
        }
        .speed-btn {
            width: 52px; height: 52px; background: rgba(0, 0, 0, 0.6); backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 50%; color: white; font-size: 22px;
            display: flex; align-items: center; justify-content: center; cursor: pointer;
        }

        /* BOTÃO DE GRAVAR MODERNO */
        #record-btn {
            width: 76px; height: 76px; background: #ef4444; border: 5px solid white; border-radius: 50%; 
            cursor: pointer; display: flex; align-items: center; justify-content: center; 
            box-shadow: 0 0 20px rgba(239, 68, 68, 0.6); transition: all 0.3s ease; outline: none;
        }

        /* LOGOMARCA INTERATIVA */
        #logo-wrapper {
            position: absolute; top: 35%; left: 25%; z-index: 5;
            touch-action: none; display: none;
        }
        
        #logo-container-inner {
            position: relative;
            width: 160px;
            will-change: transform;
        }
        
        #logo-img {
            width: 100%;
            display: block;
        }

        .hidden-ui { opacity: 0 !important; pointer-events: none !important; }
    </style>
</head>
<body>

    <div id="login-screen">
        <div class="login-box">
            <img src="logo.png" alt="Logo Premium" style="width: 100%; max-width: 100%; margin: 0 auto 20px auto; display: block; filter: drop-shadow(0 4px 6px rgba(0,0,0,0.3));">
            <p style="opacity:0.6; font-size: 13px; margin-top: 5px;">Acesso Exclusivo por Plataforma</p>
            <input type="text" id="pass" placeholder="Código da sua logomarca">
            <button onclick="login()">ENTRAR NO APP</button>
            <p id="err" style="color: #f87171; margin-top: 15px; font-size: 14px; display: none;">Logomarca não encontrada!</p>
        </div>
        
        <a href="https://instagram.com/dogz_criativa" target="_blank" style="margin-top: 25px; color: rgba(255,255,255,0.8); text-decoration: none; font-size: 15px; font-weight: 500; display: flex; align-items: center; gap: 8px;">
            <i class="fa-brands fa-instagram" style="font-size: 22px; color: #c026d3;"></i> @dogz_criativa
        </a>
    </div>

    <div id="app-container" onclick="showControls()">
        <video id="preview" autoplay playsinline muted></video>

        <div class="top-bar" id="ui-top">
            <button class="btn" title="Inverter Câmera" onclick="event.stopPropagation(); switchCam();">
                <i class="fa-solid fa-camera-rotate"></i>
            </button>
            <button class="btn" id="pause-btn" title="Pausar/Girar" onclick="event.stopPropagation(); togglePause();">
                <i class="fa-solid fa-pause" id="pause-icon"></i>
            </button>
            <button class="btn btn-clean" title="Modo Limpo" onclick="event.stopPropagation(); hideControls();">
                <i class="fa-solid fa-eye-slash"></i>
            </button>
            <button class="btn" title="Voltar ao Início" onclick="event.stopPropagation(); voltarAoInicio();" style="color: #67e8f9;">
                <i class="fa-solid fa-arrow-left"></i>
            </button>
        </div>

        <div id="logo-wrapper">
            <div id="logo-container-inner">
                <img id="logo-img" src="" alt="Logo do Cliente">
            </div>
        </div>

        <div class="bottom-bar" id="ui-bottom">
            <button class="speed-btn" onclick="event.stopPropagation(); changeSpeed(-0.2);"><i class="fa-solid fa-minus"></i></button>
            
            <button id="record-btn" onclick="event.stopPropagation(); toggleRecording();">
                <div id="record-btn-inner" style="width: 24px; height: 24px; background: white; border-radius: 50%; transition: all 0.2s;"></div>
            </button>
            
            <button class="speed-btn" onclick="event.stopPropagation(); changeSpeed(0.2);"><i class="fa-solid fa-plus"></i></button>
        </div>
    </div>

    <script>
        // --- CONSTANTES DE CONFIGURAÇÃO DE DESEMPENHO ---
        const TARGET_FPS = 24;
        const FPS_INTERVAL = 1000 / TARGET_FPS;

        // --- CACHE DE GEOMETRIA (MATA O LAYOUT THRASHING) ---
        let isLayoutDirty = true;
        let cachedVideoRect = null;
        let cachedLogoRect = null;

        function updateLayoutCache() {
            if (!video || !logoRender) return;
            cachedVideoRect = video.getBoundingClientRect();
            cachedLogoRect = logoRender.getBoundingClientRect();
            isLayoutDirty = false;
        }

        window.addEventListener('resize', () => { isLayoutDirty = true; });

        // --- GERENCIAMENTO DE LOGOS ---
        function verificarLoginSalvo() {
            const senhaSalva = localStorage.getItem('app_senha');
            const dataLogin = localStorage.getItem('app_data_login');

            if (senhaSalva && dataLogin) {
                const umMesEmMilissegundos = 30 * 24 * 60 * 60 * 1000;
                const expirou = (Date.now() - parseInt(dataLogin)) > umMesEmMilissegundos;

                if (!expirou) {
                    const logoUrl = `logos/${senhaSalva}.png`;
                    const imgTest = new Image();
                    imgTest.onload = function() {
                        setupLogoFromUrl(logoUrl);
                        liberarAcesso();
                    };
                    imgTest.onerror = function() { limparCredenciais(); };
                    imgTest.src = logoUrl;
                    return;
                }
                limparCredenciais();
            }
        }

        function login() {
            const logoName = document.getElementById('pass').value.trim().toLowerCase();
            if(!logoName) return;

            document.getElementById('err').style.display = 'none';
            const logoUrl = `logos/${logoName}.png`;

            const imgTest = new Image();
            imgTest.onload = function() {
                localStorage.setItem('app_senha', logoName);
                localStorage.setItem('app_data_login', Date.now());
                setupLogoFromUrl(logoUrl);
                liberarAcesso();
            };
            imgTest.onerror = function() {
                document.getElementById('err').innerText = "Código de logomarca inválido ou expirado!";
                document.getElementById('err').style.display = 'block';
            };
            imgTest.src = logoUrl;
        }

        function setupLogoFromUrl(url) {
            logoRender.src = url;
            wrapper.style.display = 'block';
            isLayoutDirty = true; // Força recálculo ao carregar logo nova
        }

        function liberarAcesso() {
            document.getElementById('login-screen').style.display='none';
            document.getElementById('app-container').style.display='block';
            initCamera();
        }

        function voltarAoInicio() {
            if (isRecording) stopRecording();
            limparCredenciais();

            if (stream) {
                stream.getTracks().forEach(t => t.stop());
                stream = null;
            }

            logoRender.src = "";
            wrapper.style.display = 'none';
            
            document.getElementById('app-container').style.display='none';
            document.getElementById('login-screen').style.display='flex';
            document.getElementById('pass').value = "";
            document.getElementById('err').style.display = 'none';
        }

        function limparCredenciais() {
            localStorage.removeItem('app_senha');
            localStorage.removeItem('app_data_login');
        }

        window.addEventListener('DOMContentLoaded', verificarLoginSalvo);


        // --- CONTROLE DA CÂMERA OTIMIZADO ---
        let stream;
        let camMode = "environment"; 
        const video = document.getElementById('preview');

        async function initCamera() {
            if(stream) stream.getTracks().forEach(t => t.stop());
            try {
                stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: camMode, width: { ideal: 1280 }, height: { ideal: 720 }, frameRate: { ideal: 24, max: 30 } }, 
                    audio: { channelCount: 1, echoCancellation: true, noiseSuppression: true, autoGainControl: true }
                });
                video.srcObject = stream;
            } catch (err) {
                console.warn("Iniciando sem microfone...", err);
                try {
                    stream = await navigator.mediaDevices.getUserMedia({ 
                        video: { facingMode: camMode, width: { ideal: 1280 }, height: { ideal: 720 }, frameRate: { ideal: 24, max: 30 } }, 
                        audio: false
                    });
                    video.srcObject = stream;
                } catch(finalErr) {
                    alert("A permissão da câmera é necessária.");
                }
            }
            video.onloadedmetadata = () => { isLayoutDirty = true; };
        }

        function switchCam() { 
            camMode = camMode === "user" ? "environment" : "user"; 
            initCamera(); 
        }

        // --- ANIMAÇÃO UNIFICADA E SINCRONIZADA ---
        const wrapper = document.getElementById('logo-wrapper');
        const containerInner = document.getElementById('logo-container-inner');
        const logoRender = document.getElementById('logo-img');
        
        let counter = 0;
        let speed = 0.04; 
        let isPaused = false;
        let lastAnimTime = 0;
        let currentScaleX = 1;

        function animateLogo(timestamp) {
            requestAnimationFrame(animateLogo);
            
            if (!timestamp) timestamp = performance.now();
            const elapsed = timestamp - lastAnimTime;
            
            if (elapsed < FPS_INTERVAL) return;
            lastAnimTime = timestamp - (elapsed % FPS_INTERVAL);

            if (!isPaused) {
                counter += (speed * (TARGET_FPS / 30)); 
                currentScaleX = Math.abs(Math.sin(counter)); 
                containerInner.style.transform = `scaleX(${currentScaleX})`;
            }
        }
        animateLogo();
        
        function togglePause() { 
            isPaused = !isPaused;
            const icon = document.getElementById('pause-icon');
            icon.className = isPaused ? "fa-solid fa-play" : "fa-solid fa-pause";
        }

        function changeSpeed(amount) {
            speed += (amount * 0.05);
            speed = Math.max(0.01, Math.min(speed, 0.15)); 
        }

        // --- GESTOS TOUCH ---
        let posX=0, posY=0, lastX=0, lastY=0, scale=1, lastScale=1, startDist=0;

        wrapper.addEventListener('touchstart', e => {
            if(e.touches.length===1) { 
                lastX=e.touches[0].clientX-posX; 
                lastY=e.touches[0].clientY-posY; 
            }
            if(e.touches.length===2) { 
                startDist = Math.hypot(e.touches[0].clientX-e.touches[1].clientX, e.touches[0].clientY-e.touches[1].clientY); 
                lastScale = scale; 
            }
        });

        wrapper.addEventListener('touchmove', e => {
            if(e.touches.length===1) { 
                posX=e.touches[0].clientX-lastX; 
                posY=e.touches[0].clientY-lastY; 
            }
            if(e.touches.length===2) {
                let d = Math.hypot(e.touches[0].clientX-e.touches[1].clientX, e.touches[0].clientY-e.touches[1].clientY);
                scale = Math.max(0.3, Math.min(lastScale * (d/startDist), 3)); 
            }
            wrapper.style.transform = `translate(${posX}px, ${posY}px) scale(${scale})`;
            isLayoutDirty = true; 
        });

        const uiTop = document.getElementById('ui-top');
        const uiBottom = document.getElementById('ui-bottom');
        function hideControls() { uiTop.classList.add('hidden-ui'); uiBottom.classList.add('hidden-ui'); }
        function showControls() { uiTop.classList.remove('hidden-ui'); uiBottom.classList.remove('hidden-ui'); }


        // --- MOTOR DE GRAVAÇÃO OTIMIZADO ---
        let mediaRecorder;
        let recordedChunks = [];
        let isRecording = false;
        let isProcessingRecord = false; // Trava de segurança para o botão
        let recordingCanvas = document.createElement('canvas');
        let recordCtx = recordingCanvas.getContext('2d');
        let recordingStream;
        let lastRecordFrameTime = 0;

        function drawRecordingFrame(timestamp) {
            if (!isRecording) return;
            requestAnimationFrame(drawRecordingFrame);

            if (!timestamp) timestamp = performance.now();
            const elapsed = timestamp - lastRecordFrameTime;
            
            if (elapsed < FPS_INTERVAL) return;
            lastRecordFrameTime = timestamp - (elapsed % FPS_INTERVAL);

            if (isLayoutDirty) updateLayoutCache();

            recordCtx.imageSmoothingEnabled = false;
            recordCtx.mozImageSmoothingEnabled = false;
            recordCtx.webkitImageSmoothingEnabled = false;
            recordCtx.msImageSmoothingEnabled = false;

            recordCtx.drawImage(video, 0, 0, recordingCanvas.width, recordingCanvas.height);

            if (wrapper.style.display !== 'none' && logoRender.src && cachedVideoRect && cachedLogoRect) {
                recordCtx.save();

                const scaleXFactor = recordingCanvas.width / cachedVideoRect.width;
                const scaleYFactor = recordingCanvas.height / cachedVideoRect.height;

                const logoCenterX = cachedLogoRect.left + cachedLogoRect.width / 2;
                const logoCenterY = cachedLogoRect.top + cachedLogoRect.height / 2;

                const canvasLogoX = (logoCenterX - cachedVideoRect.left) * scaleXFactor;
                const canvasLogoY = (logoCenterY - cachedVideoRect.top) * scaleYFactor;

                const canvasLogoW = cachedLogoRect.width * scaleXFactor;
                const canvasLogoH = cachedLogoRect.height * scaleYFactor;

                recordCtx.translate(canvasLogoX, canvasLogoY);
                recordCtx.scale(currentScaleX, 1);
                
                recordCtx.drawImage(logoRender, -canvasLogoW / 2, -canvasLogoH / 2, canvasLogoW, canvasLogoH);
                recordCtx.restore();
            }
        }

        function toggleRecording() {
            if (isProcessingRecord) return; 
            isProcessingRecord = true;

            if (!isRecording) {
                startRecording();
                setTimeout(() => { isProcessingRecord = false; }, 1000);
            } else {
                stopRecording();
                setTimeout(() => { isProcessingRecord = false; }, 1000);
            }
        }

        async function startRecording() {
            if (isRecording) return;
            isRecording = true;
            isLayoutDirty = true; 

            const btnInner = document.getElementById('record-btn-inner');
            btnInner.style.borderRadius = '4px';
            btnInner.style.scale = '0.8';
            document.getElementById('record-btn').style.background = '#dc2626';

            recordedChunks = [];
            
            const isAndroid = /Android/i.test(navigator.userAgent);
            recordingCanvas.width = 720;   
            recordingCanvas.height = 1280;

            lastRecordFrameTime = performance.now();
            drawRecordingFrame();
            
            recordingStream = recordingCanvas.captureStream(TARGET_FPS);

            let combinedStream;
            if (stream && stream.getAudioTracks().length > 0) {
                combinedStream = new MediaStream([
                    recordingStream.getVideoTracks()[0],
                    stream.getAudioTracks()[0]
                ]);
            } else {
                combinedStream = recordingStream;
            }

            let options = {};
            if (isAndroid) {
                // Força estritamente o WebM (VP8) no Android. O MP4 causa crash no MediaRecorder com Canvas.
                if (MediaRecorder.isTypeSupported('video/webm;codecs=vp8,opus')) {
                    options = { mimeType: 'video/webm;codecs=vp8,opus', videoBitsPerSecond: 2500000 };
                } else {
                    options = { mimeType: 'video/webm', videoBitsPerSecond: 2500000 };
                }
            } else {
                // iOS lida perfeitamente com MP4 nativo
                if (MediaRecorder.isTypeSupported('video/mp4')) {
                    options = { mimeType: 'video/mp4', videoBitsPerSecond: 2500000 };
                }
            }

            try {
                mediaRecorder = new MediaRecorder(combinedStream, options);

                mediaRecorder.ondataavailable = (e) => {
                    if (e.data && e.data.size > 0) {
                        recordedChunks.push(e.data);
                    }
                };

                mediaRecorder.onstop = () => {
                    if (recordedChunks.length === 0) return;

                    const blob = new Blob(recordedChunks, { type: mediaRecorder.mimeType || 'video/webm' });
                    const fileUrl = URL.createObjectURL(blob);

                    const downloadLink = document.createElement('a');
                    downloadLink.href = fileUrl;

                    const ext = (mediaRecorder.mimeType && mediaRecorder.mimeType.includes('mp4')) ? 'mp4' : 'webm';
                    downloadLink.download = `logocam_pro_${Date.now()}.${ext}`;
                    document.body.appendChild(downloadLink);

                    downloadLink.click();

                    setTimeout(() => {
                        if (downloadLink.parentNode) {
                            document.body.removeChild(downloadLink);
                        }
                        URL.revokeObjectURL(fileUrl);
                    }, 4000);

                    if (recordingStream) {
                        recordingStream.getTracks().forEach(track => track.stop());
                    }
                };

                mediaRecorder.start();
            } catch (err) {
                console.error("Erro ao iniciar gravação:", err);
                resetRecordButton();
                isRecording = false;
            }
        }

        function stopRecording() {
            if (!isRecording) return;
            isRecording = false;
            resetRecordButton();
            if (mediaRecorder && mediaRecorder.state !== 'inactive') {
                mediaRecorder.stop();
            }
        }

        function resetRecordButton() {
            const btnInner = document.getElementById('record-btn-inner');
            btnInner.style.borderRadius = '50%';
            btnInner.style.scale = '1';
            document.getElementById('record-btn').style.background = '#ef4444';
        }
    </script>
</body>
</html>
